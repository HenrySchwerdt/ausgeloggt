[package]
name = "ausgeloggt-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ausgeloggt desktop app (Tauri 2)"

[lib]
name = "ausgeloggt_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ausgeloggt"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde.workspace = true
serde_json.workspace = true
ausgeloggt-core.workspace = true
ausgeloggt-import.workspace = true
ausgeloggt-mail.workspace = true
ausgeloggt-catalog.workspace = true
ausgeloggt-ai.workspace = true
ausgeloggt-breach.workspace = true
ausgeloggt-letters.workspace = true
chrono.workspace = true
uuid.workspace = true
log.workspace = true
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"
