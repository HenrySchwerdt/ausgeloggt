[package]
name = "spurlos-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Spurlos desktop app (Tauri 2)"

[lib]
name = "spurlos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "spurlos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
spurlos-core.workspace = true
spurlos-import.workspace = true
spurlos-mail.workspace = true
spurlos-catalog.workspace = true
spurlos-ai.workspace = true
