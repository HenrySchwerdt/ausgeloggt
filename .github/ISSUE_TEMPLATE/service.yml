name: Service / deletion info
description: A service is missing, or its deletion link / difficulty is wrong
labels: [catalog]
body:
  - type: input
    attributes:
      label: Service and domain
      placeholder: Example GmbH, example.com
    validations:
      required: true
  - type: input
    attributes:
      label: Deletion page URL
  - type: dropdown
    attributes:
      label: Difficulty
      options: [Easy, Medium, Hard, Impossible, Unknown]
  - type: textarea
    attributes:
      label: Notes (steps, privacy contact, postal address)
