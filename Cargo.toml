[workspace]
resolver = "2"
members = [
    "crates/ausgeloggt-core",
    "crates/ausgeloggt-import",
    "crates/ausgeloggt-mail",
    "crates/ausgeloggt-catalog",
    "crates/ausgeloggt-ai",
    "crates/ausgeloggt-breach",
    "crates/ausgeloggt-letters",
    "desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
ausgeloggt-core = { path = "crates/ausgeloggt-core" }
ausgeloggt-import = { path = "crates/ausgeloggt-import" }
ausgeloggt-mail = { path = "crates/ausgeloggt-mail" }
ausgeloggt-catalog = { path = "crates/ausgeloggt-catalog" }
ausgeloggt-ai = { path = "crates/ausgeloggt-ai" }
ausgeloggt-breach = { path = "crates/ausgeloggt-breach" }
ausgeloggt-letters = { path = "crates/ausgeloggt-letters" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
