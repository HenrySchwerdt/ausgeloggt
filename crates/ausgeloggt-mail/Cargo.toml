[package]
name = "ausgeloggt-mail"
description = "Postfach-Scan per IMAP und Klassifizierung von Mails"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ausgeloggt-core.workspace = true
serde.workspace = true
chrono.workspace = true
thiserror.workspace = true
log.workspace = true
uuid.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0.12"
mailparse = "0.18.0"
regex = "1.13.1"
percent-encoding = "2.3.2"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "rustls", "ring", "webpki-roots"] }
